<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Token Test</title>
</head>
<body>
  <h2>Bearer Token Request Tester</h2>

  <label for="token">Enter Bearer Token:</label><br />
  <input type="text" id="token" placeholder="Paste token here..." style="width: 300px;" />
  <br /><br />
  
  <button onclick="makeRequest()">Send Request</button>

  <pre id="response" style="margin-top: 20px; white-space: pre-wrap;"></pre>

  <script>
    function makeRequest() {
      const token = document.getElementById('token').value;
      const responseContainer = document.getElementById('response');

      fetch('http://localhost:8080/home', {
        method: 'GET',
        headers: {
          'Authorization': 'Bearer ' + token,
          'Content-Type': 'application/json'
        },
        redirect: 'follow' // handles redirection
      })
      .then(async response => {
        const text = await response.text();
        responseContainer.textContent = `Status: ${response.status}\n\n${text}`;
        if (!response.ok) {
          console.warn("Request failed or redirected.");
        }
      })
      .catch(error => {
        responseContainer.textContent = 'Error: ' + error.message;
        console.error('Error:', error);
      });
    }
  </script>
</body>
</html>
